<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page="Page not found"></title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/" data-site="name"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Work</a>
      <a href="/about">About</a>
      <button type="button" class="theme-toggle" id="theme-toggle" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </nav>
  </header>

  <!-- Cloudflare shows this page for any address that does not exist. -->
  <main class="not-found">
    <p class="not-found-code">404</p>
    <h1>Page not found</h1>
    <p class="muted">This page does not exist, or it has moved.</p>
    <p><a class="button-link" href="/">See all photo sets</a></p>
  </main>

  <footer class="site-footer">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>
</body>
</html>
