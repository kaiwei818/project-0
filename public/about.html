<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- The color of the phone's browser bar; js/theme.js keeps it in step with dark mode. -->
  <meta name="theme-color" content="#ffffff">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page="About"></title>
  <!-- Link-preview tags, filled in by functions/about.js -->
  <meta name="description" content="">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/menu.js" defer></script>
  <script src="/js/share.js" defer></script>
  <script src="/js/protect.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="site-name" href="/" data-site="name"></a>
    <div class="header-tools">
      <!-- Work / About / Contact, filled in by functions/_middleware.js (lib/chrome.js). -->
      <nav class="site-nav" id="site-nav" aria-label="Main"></nav>
      <div class="header-buttons">
        <!-- Light / dark, shown and labelled by js/theme.js. -->
        <button type="button" class="round-button theme-toggle" data-theme-toggle hidden aria-label="Switch to dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
        </button>
        <button type="button" class="round-button menu-button" id="menu-button" aria-haspopup="dialog" aria-controls="site-menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          <span class="menu-button-label">Menu</span>
        </button>
      </div>
    </div>
  </header>
  <!-- The slide-in menu, filled in by functions/_middleware.js (lib/chrome.js)
       and opened by js/menu.js. -->
  <dialog class="site-menu" id="site-menu" aria-label="Menu"></dialog>

  <!-- functions/about.js fills in the portrait, bio, and contact details
       from what you saved in the admin area. -->
  <main id="main" class="about">
    <div class="about-portrait" id="about-portrait"></div>
    <div class="about-text">
      <h1>About <span data-site="owner"></span></h1>
      <div class="about-bio" id="about-bio"></div>
      <h2 id="gear-heading">Gear</h2>
      <ul class="about-gear" id="about-gear" aria-labelledby="gear-heading"></ul>
      <h2 id="contact-heading">Contact</h2>
      <ul class="about-contact" id="about-contact" aria-labelledby="contact-heading"></ul>
    </div>
  </main>

  <footer class="site-footer" id="contact">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>
</body>
</html>
