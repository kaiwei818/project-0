<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page="About"></title>
  <!-- Link-preview tags, filled in by functions/about.js -->
  <meta name="description" content="">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/menu.js" defer></script>
  <script src="/js/share.js" defer></script>
  <script src="/js/protect.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/" data-site="name"></a>
    <button type="button" class="menu-button" id="menu-button" aria-haspopup="dialog" aria-controls="site-menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="menu-button-label">Menu</span>
    </button>
  </header>
  <!-- The slide-in menu, filled in by functions/_middleware.js (lib/chrome.js)
       and opened by js/menu.js. -->
  <dialog class="site-menu" id="site-menu" aria-label="Menu"></dialog>

  <!-- functions/about.js fills in the portrait, bio, and contact details
       from what you saved in the admin area. -->
  <main class="about">
    <div class="about-portrait" id="about-portrait"></div>
    <div class="about-text">
      <h1>About <span data-site="owner"></span></h1>
      <div class="about-bio" id="about-bio"></div>
      <h2 id="contact-heading">Contact</h2>
      <ul class="about-contact" id="about-contact" aria-labelledby="contact-heading"></ul>
    </div>
  </main>

  <footer class="site-footer" id="contact">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>
</body>
</html>
