<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-page="Dashboard · Admin"></title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header admin-header">
    <a class="site-name" href="/admin/"><span data-site="name"></span> admin</a>
    <nav>
      <a href="/" target="_blank">View site</a>
      <button type="button" id="logout" class="button-secondary">Log out</button>
    </nav>
  </header>

  <main>
    <h1>Dashboard</h1>

    <section class="stat-card" aria-labelledby="storage-heading">
      <h2 id="storage-heading">Storage</h2>
      <p id="storage-text">Loading...</p>
      <div class="meter"><div class="meter-fill" id="storage-fill"></div></div>
      <p class="muted" id="counts"></p>
      <!-- <details> is a built-in open/close box: click the summary line to expand it. -->
      <details class="storage-details">
        <summary>See storage by set</summary>
        <ul class="storage-list" id="storage-list"></ul>
      </details>
    </section>

    <section aria-labelledby="sets-heading">
      <h2 id="sets-heading">Sets</h2>
      <form id="new-set-form" class="inline-form">
        <label for="new-set-title" class="visually-hidden">New set title</label>
        <input id="new-set-title" name="title" type="text" maxlength="200" placeholder="New set title" required>
        <button type="submit">Create set</button>
      </form>
      <p class="form-error" id="new-set-error" role="alert"></p>
      <p class="muted">The order here is the order on the home page. Drag ⠿ or use ↑ ↓ to change it.</p>
      <ul class="admin-set-list" id="set-list"></ul>
    </section>
  </main>

  <script src="/js/admin.js" type="module"></script>
</body>
</html>
