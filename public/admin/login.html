<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title data-page="Log in · Admin"></title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <main class="login">
    <h1><span data-site="name"></span> admin</h1>
    <form id="login-form" class="card-form">
      <!-- autocomplete="username" and "current-password" let Safari and password
           managers fill these in and offer to save them. -->
      <label for="username">Username</label>
      <input id="username" name="username" type="text" autocomplete="username"
             autocapitalize="none" spellcheck="false" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log in</button>
      <!-- role="alert" makes screen readers announce errors as soon as they appear. -->
      <p class="form-error" id="error" role="alert"></p>
    </form>
  </main>
  <script src="/js/admin-login.js" type="module"></script>
</body>
</html>
