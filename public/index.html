<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="google-site-verification" content="7Zmj3_jo4RZ66dJ6qedgmStbcZn9X63tziRzR4stH-U" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page=""></title>
  <!-- Link-preview tags, filled in by functions/index.js -->
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
  <script src="/js/menu.js" defer></script>
  <script src="/js/share.js" defer></script>
  <script src="/js/protect.js" defer></script>
</head>
<body>
  <header class="site-header" id="top">
    <a class="site-name" href="/" data-site="name"></a>
    <button type="button" class="menu-button" id="menu-button" aria-haspopup="dialog" aria-controls="site-menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      <span class="menu-button-label">Menu</span>
    </button>
  </header>
  <!-- The slide-in menu, filled in by functions/_middleware.js (lib/chrome.js)
       and opened by js/menu.js. -->
  <dialog class="site-menu" id="site-menu" aria-label="Menu"></dialog>

  <main>
    <h1 class="visually-hidden">Photo sets</h1>
    <!-- The big featured photo, filled in by functions/index.js (only on the
         unfiltered home page; the plain tagline below is used otherwise). -->
    <section class="hero" id="hero" aria-label="Featured set"></section>
    <p class="site-tagline" id="site-tagline" data-site="description"></p>
    <!-- Category filter buttons, filled in by functions/index.js (hidden when there are none). -->
    <nav class="category-nav" id="category-nav" aria-label="Categories"></nav>
    <!-- functions/index.js fills this list with one card per published set. -->
    <ul class="set-grid" id="set-grid"></ul>
    <p class="status" id="status"></p>
  </main>

  <footer class="site-footer" id="contact">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>

</body>
</html>
