<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="google-site-verification" content="7Zmj3_jo4RZ66dJ6qedgmStbcZn9X63tziRzR4stH-U" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page=""></title>
  <!-- Link-preview tags, filled in by functions/index.js -->
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/" data-site="name"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/" aria-current="page">Work</a>
      <a href="/about">About</a>
      <button type="button" class="theme-toggle" id="theme-toggle" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <h1 class="visually-hidden">Photo sets</h1>
    <!-- The big featured photo, filled in by functions/index.js (only on the
         unfiltered home page; the plain tagline below is used otherwise). -->
    <section class="hero" id="hero" aria-label="Featured set"></section>
    <p class="site-tagline" id="site-tagline" data-site="description"></p>
    <!-- Category filter buttons, filled in by functions/index.js (hidden when there are none). -->
    <nav class="category-nav" id="category-nav" aria-label="Categories"></nav>
    <!-- functions/index.js fills this list with one card per published set. -->
    <ul class="set-grid" id="set-grid"></ul>
    <p class="status" id="status"></p>
  </main>

  <footer class="site-footer">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>

</body>
</html>
