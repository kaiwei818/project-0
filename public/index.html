<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page=""></title>
  <!-- Link-preview tags, filled in by functions/index.js -->
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/" data-site="name"></a>
  </header>

  <main>
    <h1 class="visually-hidden">Sets</h1>
    <!-- home.js fills this list with one card per set. -->
    <ul class="set-grid" id="set-grid" aria-live="polite"></ul>
    <p class="status" id="status">Loading...</p>
  </main>

  <footer class="site-footer">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>

  <script src="/js/home.js" type="module"></script>
</body>
</html>
