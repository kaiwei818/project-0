<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text in data-site="..." elements and the title come from lib/site.js (see functions/_middleware.js). -->
  <title data-page=""></title>
  <!-- Link-preview tags, filled in by functions/sets/[slug].js -->
  <meta name="description" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <link rel="canonical" href="">
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="site-name" href="/" data-site="name"></a>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Work</a>
      <a href="/about">About</a>
      <button type="button" class="theme-toggle" id="theme-toggle" hidden>
        <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M4.6 19.4l2.1-2.1M17.3 6.7l2.1-2.1"/></svg>
      </button>
    </nav>
  </header>

  <main>
    <!-- Shown only when you, logged in, preview a set that is still a draft. -->
    <p class="draft-banner" id="draft-banner" hidden>
      Draft preview: only you can see this set. Publish it from the admin page.
    </p>
    <a class="back-link" href="/">All sets</a>
    <h1 id="set-title"></h1>
    <p class="set-description" id="set-description"></p>
    <!-- functions/sets/[slug].js fills in the title, description, and photos. -->
    <ul class="photo-grid" id="photo-grid"></ul>
    <p class="status" id="status"></p>
    <!-- Licensed downloads: shown by functions/sets/[slug].js only when the set has
         downloadable photos. set.js checks the code and shows Download buttons. -->
    <section class="license-panel" id="license-panel" hidden aria-labelledby="license-heading">
      <h2 id="license-heading">Have a license code?</h2>
      <p class="muted" id="license-help">Enter the code you received to download full-quality copies without the watermark.</p>
      <form id="license-form" class="inline-form">
        <label for="license-code" class="visually-hidden">License code</label>
        <input id="license-code" type="text" placeholder="WL-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
        <button type="submit">Unlock</button>
      </form>
      <p class="form-error" id="license-error" role="alert"></p>
    </section>

    <!-- The photo details for the viewer, as data (browsers never run this). -->
    <script type="application/json" id="set-data">[]</script>
  </main>

  <footer class="site-footer">
    © <span data-site="year"></span> <span data-site="owner"></span> · <span data-site="name"></span>
  </footer>

  <!-- The full-screen viewer. Hidden until a photo is tapped (see js/lightbox.js). -->
  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <div class="lightbox-stage">
      <img id="lightbox-img" alt="" draggable="false">
    </div>
    <p class="lightbox-counter" id="lightbox-counter"></p>
    <div class="lightbox-info" id="lightbox-info" hidden>
      <p class="lightbox-caption" id="lightbox-caption"></p>
      <p class="lightbox-camera" id="lightbox-camera"></p>
    </div>
    <a class="lightbox-download" id="lightbox-download" hidden download>Download</a>
    <button type="button" class="lightbox-button lightbox-close" id="lightbox-close" aria-label="Close">×</button>
    <button type="button" class="lightbox-button lightbox-prev" id="lightbox-prev" aria-label="Previous photo">‹</button>
    <button type="button" class="lightbox-button lightbox-next" id="lightbox-next" aria-label="Next photo">›</button>
  </dialog>

  <script src="/js/set.js" type="module"></script>
</body>
</html>
